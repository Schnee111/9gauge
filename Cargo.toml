[workspace]
resolver = "2"
members = ["crates/gauge-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
compact_str = { version = "0.8", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"
hex = "0.4"
sha2 = "0.10"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
